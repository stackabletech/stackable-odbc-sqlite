[package]
name = "stackable-odbc-sqlite"
version = "0.0.1"
edition = "2024"
rust-version = "1.95.0"
authors = ["Stackable GmbH <info@stackable.tech>"]
license = "Apache-2.0"
description = "ODBC driver for SQLite, built on the stackable-odbc-core framework."
repository = "https://github.com/stackabletech/stackable-odbc-sqlite"
readme = "README.md"
keywords = ["odbc", "sqlite", "driver", "ffi", "sql"]
categories = ["database", "external-ffi-bindings", "api-bindings"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rusqlite = { version = "0.40", features = ["bundled", "column_decltype"] }
snafu = "0.9"
# TODO: switch to a crates.io version dep once stackable-odbc-core is published.
stackable-odbc-core = { path = "../stackable-odbc-core" }
tracing = "0.1"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
proptest = "1"

[lints.clippy]
unwrap_in_result = "deny"
unwrap_used = "deny"
panic = "deny"

[[bench]]
name = "fetch_sqlite"
harness = false
